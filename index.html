<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Réplica UI — Choose Seats</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="bg-[#e9ecef] font-['Plus_Jakarta_Sans',sans-serif] antialiased min-h-screen flex items-center justify-center p-0 md:p-8 lg:p-12 overflow-x-hidden">

  <main class="w-full max-w-[1100px] bg-[#f8f9fa] md:rounded-[36px] h-screen md:h-auto p-3 sm:p-6 md:p-10 shadow-2xl border-0 md:border border-white/60 relative flex flex-col justify-between overflow-hidden">
    
    <!-- Header -->
    <!-- Header Centrado en Móvil -->
    <header class="flex justify-between items-center mb-2 md:mb-6 pt-2 md:pt-0 shrink-0">
      <div class="flex items-center gap-3">
        <button class="md:hidden w-7 h-7 rounded-full border border-slate-300 flex items-center justify-center text-slate-600 text-xs shrink-0">←</button>
      </div>
      
      <div class="text-center flex-1 px-2">
        <h1 class="text-xl md:text-[32px] font-extrabold text-[#101214] tracking-tight leading-none">Choose Seats</h1>
        <p class="text-[8px] md:text-[10px] font-bold text-[#8b939c] tracking-[0.15em] mt-1.5 uppercase flex items-center justify-center">
          BOG <span class="mx-1 font-normal">→</span> MDE <span class="mx-1 font-normal text-slate-300">•</span> A320NEO <span class="mx-1 font-normal text-slate-300">•</span> 12 SEP
        </p>
      </div>

      <div class="flex items-center gap-3 shrink-0">
        <span class="hidden md:inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[10px] font-semibold text-[#4a5568] bg-white border border-[#e2e8f0] shadow-sm">
          <span class="w-1.5 h-1.5 rounded-full bg-[#10b981]"></span> Check-in abierto
        </span>
        <div class="relative w-9 h-9 md:w-10 md:h-10 rounded-full bg-[#e2d6c3] flex items-center justify-center font-bold text-xs text-[#524534]">
          JR
          <span class="absolute bottom-0 right-0 w-2.5 h-2.5 md:w-3 md:h-3 bg-[#101214] rounded-full border-2 border-white"></span>
        </div>
      </div>
    </header>

    <!-- Visualizador de Avión Proporcionado -->
    <section class="relative bg-[#f4f5f7] rounded-[24px] md:rounded-[32px] p-4 md:p-12 my-2 md:my-6 border border-[#e9ecef] flex items-center justify-center min-h-[100px] md:min-h-[220px] overflow-hidden bg-[radial-gradient(#d1d5db_1.5px,transparent_1.5px)] [background-size:20px_20px] md:[background-size:24px_24px] shrink-0">
      
      <!-- Controles Laterales -->
      <div class="hidden md:flex absolute left-6 md:left-10 top-1/2 -translate-y-1/2 flex-col gap-2.5 z-20">
        <button class="w-9 h-9 rounded-full bg-white shadow-sm border border-[#e2e8f0] flex items-center justify-center text-xs text-[#64748b] hover:bg-slate-50 transition">◇</button>
        <button class="w-9 h-9 rounded-full bg-white shadow-sm border border-[#e2e8f0] flex items-center justify-center text-xs text-[#64748b] hover:bg-slate-50 transition">
          <div class="w-2.5 h-2.5 border-t-2 border-l-2 border-[#64748b] rotate-45"></div>
        </button>
      </div>

      <!-- Silueta Desktop con Ancho Real Proporcionado -->
      <div class="relative w-full max-w-[820px] flex items-center justify-center">
        
        <!-- Alas proporcionales de fondo -->
        <svg class="absolute w-full h-auto opacity-25 text-[#cbd5e1] pointer-events-none" viewBox="0 0 820 180" fill="currentColor">
          <polygon points="340,90 590,10 640,10 490,90" />
          <polygon points="340,90 590,170 640,170 490,90" />
          <polygon points="690,90 760,45 790,45 740,90" />
          <polygon points="690,90 760,135 790,135 740,90" />
        </svg>
        
        <!-- Cilindro ancho -->
        <div class="w-full h-[32px] md:h-[36px] bg-gradient-to-b from-[#ffffff] via-[#f1f5f9] to-[#cbd5e1] rounded-full shadow-inner flex items-center px-6 relative z-0">
           <div class="w-full flex justify-between px-2 opacity-30">
              <span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span><span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span><span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span><span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span><span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span><span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span><span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span><span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span><span class="w-1.5 h-1.5 rounded-full bg-[#101214]"></span>
           </div>
        </div>
        
        <!-- Cuadro Selector 100% transparente y nítido -->
        <div id="airplane-selector" class="absolute top-1/2 -translate-y-1/2 w-[210px] md:w-[230px] h-[64px] md:h-[72px] bg-transparent rounded-[22px] border-[1px] border-[#101214] shadow-[0_4px_16px_rgba(0,0,0,0.03)] flex justify-center transition-all duration-700 ease-[cubic-bezier(0.4,0,0.2,1)] z-10" style="left: 2.5%;">
          <span id="airplane-selector-text" class="absolute -top-[10px] bg-[#101214] text-white text-[8px] md:text-[8.5px] font-extrabold tracking-[0.2em] px-3.5 py-0.5 rounded-full uppercase leading-none">BUSINESS</span>
        </div>
      </div>
    </section>

    <!-- Pestañas y Leyenda -->
    <section class="flex flex-col md:flex-row justify-between items-center gap-2 md:gap-4 my-2 md:my-4 shrink-0">
      <div class="flex items-center gap-4 w-full md:w-auto overflow-x-auto justify-center">
        <div class="flex bg-[#e9ecef] p-1 rounded-full w-auto shrink-0">
          <button data-class="1" class="tab-btn px-6 md:px-8 py-1.5 md:py-2 rounded-full text-xs font-bold bg-[#101214] text-white shadow-sm transition-all cursor-pointer">1</button>
          <button data-class="2" class="tab-btn px-6 md:px-8 py-1.5 md:py-2 rounded-full text-xs font-bold text-[#64748b] hover:text-[#101214] transition-all cursor-pointer">2</button>
          <button data-class="3" class="tab-btn px-6 md:px-8 py-1.5 md:py-2 rounded-full text-xs font-bold text-[#64748b] hover:text-[#101214] transition-all cursor-pointer">3</button>
        </div>
      </div>

      <div class="flex items-center gap-4 text-[10px] md:text-[11px] font-semibold text-[#64748b] shrink-0 justify-center w-full md:w-auto">
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#e2e8f0]"></span> Disponible</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#94a3b8]"></span> Ocupado</span>
        <span class="flex items-center gap-1.5"><span class="w-2.5 h-2.5 rounded-full bg-[#5b4dff]"></span> Tu selección</span>
      </div>
    </section>

    <!-- Grid Inferior  -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6 items-stretch flex-1 overflow-hidden">
      
      <!-- Card Negra 3D -->
      <article class="hidden lg:flex lg:col-span-4 xl:col-span-3 bg-[#101214] text-white rounded-[28px] p-7 flex-col justify-between shadow-xl min-h-[320px]">
        <div class="flex justify-between items-start">
          <div class="w-[42px] h-[42px] rounded-xl bg-[#d2f842] flex items-center justify-center p-2.5">
            <div class="grid grid-cols-3 gap-[3px] w-full h-full">
              <span class="bg-[#101214] rounded-full"></span><span class="bg-[#101214] rounded-full"></span><span class="bg-[#101214] rounded-full"></span>
              <span class="bg-[#101214] rounded-full"></span><span class="bg-[#101214] rounded-full"></span><span class="bg-[#101214] rounded-full"></span>
              <span class="bg-[#101214] rounded-full"></span><span class="bg-[#101214] rounded-full"></span><span class="bg-[#101214] rounded-full"></span>
            </div>
          </div>
          <span class="text-slate-400 text-sm font-light">↗</span>
        </div>
        <div>
          <h3 class="text-[17px] font-bold text-white mb-2">3D Rendering</h3>
          <p class="text-[11px] text-[#8b939c] leading-[1.6] pr-2">Recorre la cabina de tu avión con visualización 3D y siente lo que te espera a bordo.</p>
        </div>
      </article>

      <!-- Panel de Asientos Compacto (Sin Scroll) -->
      <section class="lg:col-span-8 xl:col-span-9 bg-[#f9fafb] rounded-[24px] md:rounded-[28px] py-3 px-3 md:px-2 flex flex-col justify-between border border-[#e2e8f0] relative">
        <div class="hidden md:block absolute left-0 top-0 bottom-0 w-8 bg-[repeating-linear-gradient(-45deg,#f1f5f9,#f1f5f9_3px,transparent_3px,transparent_8px)] opacity-60 rounded-l-[28px]"></div>
        <div class="hidden md:block absolute right-0 top-0 bottom-0 w-8 bg-[repeating-linear-gradient(-45deg,#f1f5f9,#f1f5f9_3px,transparent_3px,transparent_8px)] opacity-60 rounded-r-[28px]"></div>

        <div class="relative z-10 w-full px-2 md:px-10 pb-1">
          <div class="flex justify-between items-center mb-2 md:mb-4 min-w-[280px]">
            <h3 id="section-title" class="font-bold text-[#101214] text-xs md:text-[13px]">Section 1 (Business Class)</h3>
            <span id="section-info" class="text-[9px] md:text-[10px] text-[#a0aec0] font-medium tracking-wide">35 libres <span class="mx-1">•</span> $480 / asiento</span>
          </div>

          <!-- Grilla de Asientos -->
          <div id="seat-grid" class="w-full flex flex-col justify-center items-center min-w-[280px] space-y-1"></div>
        </div>

        <!-- Barra Checkout -->
        <footer class="w-full bg-[#101214] md:bg-white rounded-t-[22px] md:rounded-[20px] p-3.5 md:p-3 shadow-lg md:shadow-sm border-t border-[#22252a] md:border-[#e2e8f0] flex justify-between items-center gap-2 mt-auto z-50">
          <div id="selected-seats-container" class="flex items-center gap-1.5 flex-wrap pl-1 max-w-[50%] overflow-hidden"></div>
          <div class="flex items-center gap-4 pr-1 shrink-0">
            <div class="text-right flex flex-col justify-center">
              <span class="block text-[7px] uppercase font-extrabold text-[#8b939c] md:text-[#a0aec0] tracking-[0.2em]">TOTAL</span>
              <span id="total-price" class="text-base md:text-[17px] font-black text-white md:text-[#101214] leading-none">$0</span>
            </div>
            <button id="btn-confirm" class="bg-[#d2f842] text-[#101214] font-bold px-5 py-2.5 rounded-[12px] text-xs shadow-sm hover:brightness-95 transition">
              Confirmar (0)
            </button>
          </div>
        </footer>

      </section>
    </div>
  </main>

  <script type="module" src="/src/js/main.js"></script>
</body>
</html>
